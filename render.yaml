# render.yaml — Render Infrastructure Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Defines the backend web service (the frontend lives on Vercel).
# `generateValue: true` vars are created by Render; `sync: false` vars are
# secrets you paste into the Render dashboard. See DEPLOY.md for the checklist.

services:
  - type: web
    name: talentstream-ai-api
    runtime: python
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free           # sleeps after 15 min idle; change to starter to stay awake
    autoDeploy: true

    healthCheckPath: /health

    envVars:
      # ── Core ─────────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      # ── Auth / JWT ────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true    # Render generates a secure random value on first deploy

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # ── Database (Supabase Postgres, SESSION pooler string) ──────────────
      - key: DATABASE_URL
        sync: false            # Supabase → Connect → Session pooler (IPv4, port 5432)

      # ── Redis is optional: without REDIS_URL the app skips caching and
      #    rate limiting. Add an Upstash rediss:// URL here later if wanted.

      # ── Google / Gemini AI ────────────────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false            # https://aistudio.google.com/apikey

      # ── Supabase (resume file storage) ────────────────────────────────────
      - key: SUPABASE_URL
        sync: false            # https://<project-ref>.supabase.co

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # Supabase → Settings → API Keys (service_role / secret)

      - key: SUPABASE_STORAGE_BUCKET
        value: resumes

      - key: SUPABASE_STORAGE_BUCKET_PUBLIC
        value: "false"

      # ── CORS / Frontend ───────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://talentstream-ai-pi.vercel.app

      # ── ATS ───────────────────────────────────────────────────────────────
      - key: ATS_SCORE_THRESHOLD
        value: "65"

      # ── Observability (optional) ──────────────────────────────────────────
      - key: SENTRY_DSN
        value: ""
